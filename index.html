<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Pastry Paladins</title>
  <meta name="description" content="A co-op arena platformer for 1–4 players. Stomp gumdrops, collect muffins, defeat the Burnt Baron — together, online or on one screen.">
  <meta name="theme-color" content="#2b1630">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui"></div>
  <div id="touch-root"></div>
  <button id="pausebtn" title="Pause (Esc)">❚❚</button>
  <div id="toasts"></div>
  <div id="rotate"><div class="rot-icon">📱</div><div>Rotate your device to landscape</div></div>
  <noscript>Pastry Paladins needs JavaScript to run.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
